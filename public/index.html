<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Nikel</title>
</head>

<body id="login">
    <main>
        <div class="container">
            <div class="row vh-100">
                <div class="col-md-6 d-flex justify-content-center flex-column">
                    <div class="text-login">
                        <p>Organize suas finanças de uma forma fácil.</p>
                        <p>Controle seu dinheiro e investimentos.</p>
                        <p>Economize e atinja seus objetivos.</p>
                    </div>
                    <div class="text-center">
                        <img src="./assets/images/pocket.png" alt="imagem pocket" class="img-fluid" srcset="">
                        <img src="./assets/images/coins.png" alt="imagem coins"
                            class="img-fluid d-none d-md-inline coins" srcset="">
                    </div>
                </div>
                <div class="col d-flex justify-content-center flex-column">
                    <div class="container">
                        <div class="row">
                            <div class="col">
                                <div class="text-center mb-3">
                                    <img src="./assets/images/nikel-logo.png" alt="logo nikel" class="img-fluid"
                                        srcset="">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="loginEmailInput" class="form-label">E-mail</label>
                                        <input type="email" class="form-control" id="loginEmailInput"
                                            aria-describedby="emailHelp">
                                        <div id="emailHelp" class="form-text">Utilize seu email para realizar o login
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="loginPasswordInput" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="loginPasswordInput">
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="sessionCheck">
                                        <label class="form-check-label" for="sessionCheck">Permanecer logado</label>
                                    </div>
                                    <button type="submit" class="btn btn-login">Entrar</button>
                                </form>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p class="text-center mt-2 form-text">Ainda não tem conta? <span><a href="#"
                                            class="link-default" data-bs-toggle="modal"
                                            data-bs-target="#registerModal" id="linkCreateAccount">Criar conta.</a></span></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="text-center mt-5">
                                    <img src="./assets/images/codai-logo.png" alt="logo codaí" srcset="">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="text-center">
                                    <img src="./assets/images/growdev-logo.png" alt="logo growdev" srcset="">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Crie sua conta</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="modalRegisterForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="emailCreateInput" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="emailCreateInput"
                                    aria-describedby="emailHelp" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordCreateInput" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="passwordCreateInput" required>
                            </div>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary btn-cancel"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-default">Criar conta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="./js/index.js"></script>
</body>

</html>
